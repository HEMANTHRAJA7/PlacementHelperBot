version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: placement_sentinel_db
    environment:
      POSTGRES_DB: placement_sentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: placement_sentinel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
